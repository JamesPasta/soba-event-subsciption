# Sidecar services for local development.
# Run from inside the devcontainer: docker compose -f .devcontainer/docker-compose.yml up -d
#
# Connection strings (from inside devcontainer):
#   MongoDB:   mongodb://host.docker.internal:27017
#   PostgreSQL: postgresql://postgres:postgres@host.docker.internal:5432/postgres
#   Form.io:   http://host.docker.internal:3001
#
# Local Form.io credentials (for backend .env):
#   FORMIO_BASE_URL=http://host.docker.internal:3001
#   FORMIO_ADMIN_USERNAME=formio@localhost.com
#   FORMIO_ADMIN_PASSWORD=formio
#   FORMIO_MANAGER_USERNAME=formio@localhost.com
#   FORMIO_MANAGER_PASSWORD=formio

name: soba-dev-services
services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  formio:
    # Keep in step with formio.image.tag in deployments/helm/soba/values.yaml.
    image: formio/formio:4.11.0
    platform: linux/amd64
    ports:
      - "3001:3001"
    environment:
      ROOT_EMAIL: "formio@localhost.com"
      ROOT_PASSWORD: "formio"
      # reservedForms includes "health" so GET /health reaches the server sanity-check (DB + schema). Without it, /health is treated as a form alias and returns 400.
      NODE_CONFIG: '{"mongo":"mongodb://mongodb:27017/formio-ce","port":3001,"jwt":{"secret":"formio-dev-secret-change-in-production"},"reservedForms":["submissions","submission","exists","export","role","current","logout","import","form","access","health"]}'
    depends_on:
      - mongodb
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # The 18 image keeps its data under /var/lib/postgresql/18/docker.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/temporal-dynamicconfig.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./config:/etc/temporal/config/dynamicconfig
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.48.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"
    restart: unless-stopped

volumes:
  mongodb_data:
  postgres18_data:
