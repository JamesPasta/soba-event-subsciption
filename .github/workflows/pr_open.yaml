# PR pipeline: QA (type-check, lint, format, unit tests), then build/deploy when app paths change.
# Also runnable manually (workflow_dispatch) with just a PR number (like CHEFS); a manual
# run force-deploys, bypassing the changed-paths gate.
name: PR Open
run-name: PR-${{ github.event.number || github.event.inputs.pr-number }}

env:
  ACRONYM: soba
  # PR deployments share the dev host and are told apart by path, so the Keycloak redirect URIs
  # stay a finite set (one wildcard per environment) without a pool of slot hostnames.
  DEV_HOST_PREFIX: soba-dev

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
  # Manual trigger: build & deploy a specific PR on demand. Provide just the PR number
  # (e.g. 42). A manual run force-deploys, bypassing the changed-paths gate below.
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.event.inputs.pr-number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.deploy == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            deploy:
              - 'backend/**'
              - 'frontend/**'
              - 'lib/**'
              - '.github/workflows/pr_open.yaml'
              - '.github/workflows/gateway-proxy-check.yaml'
              - '.github/workflows/build-images.yaml'
              - '.github/workflows/qa.yaml'
              - '.github/actions/**'
              - '.gitignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'deployments/**'

  qa:
    name: QA
    uses: ./.github/workflows/qa.yaml
    permissions:
      contents: read

  set-vars:
    name: Set variables
    runs-on: ubuntu-24.04
    environment: pr
    needs: [qa, changes]
    if: ${{ needs.changes.outputs.deploy == 'true' && !startsWith(github.head_ref, 'release/') && github.head_ref != 'main' }}
    outputs:
      JOB_NAME: ${{ steps.vars.outputs.JOB_NAME }}
      URL: ${{ steps.vars.outputs.URL }}
      URL_FORMS: ${{ steps.vars.outputs.URL_FORMS }}
      ref: ${{ steps.vars.outputs.ref }}
      PR_NUM: ${{ steps.vars.outputs.PR_NUM }}
      FRONTEND_HOST: ${{ steps.vars.outputs.FRONTEND_HOST }}
      APS_PR_ENABLED: ${{ steps.vars.outputs.APS_PR_ENABLED }}
    steps:
      - name: Setting variables
        id: vars
        env:
          PR_NUMBER: ${{ github.event.number || github.event.inputs.pr-number }}
        run: |
          # The concurrency group is keyed on the raw input, so it must already be the bare number.
          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr-number must be digits only, e.g. 42 (got '${PR_NUMBER}')."
            exit 1
          fi
          FRONTEND_HOST="${DEV_HOST_PREFIX}.${{ vars.OC_DOMAIN }}"
          echo "PR_NUM=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "JOB_NAME=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_HOST=$FRONTEND_HOST" >> "$GITHUB_OUTPUT"
          echo "URL=https://${FRONTEND_HOST}/designer-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "URL_FORMS=https://${FRONTEND_HOST}/forms-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/pull/$PR_NUMBER/head" >> "$GITHUB_OUTPUT"
          echo "APS_PR_ENABLED=${{ vars.APS_PR_ENABLED == 'true' }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push
    uses: ./.github/workflows/build-images.yaml
    needs: [set-vars]
    with:
      ref: ${{ needs.set-vars.outputs.ref }}
      platforms: amd64
      image_version: pr-${{ needs.set-vars.outputs.PR_NUM }}
      base_path_suffix: -${{ needs.set-vars.outputs.PR_NUM }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy-crunchy:
    name: Deploy Crunchy Postgres
    needs: [set-vars]
    runs-on: ubuntu-24.04
    environment: pr
    outputs:
      cluster: ${{ steps.crunchy.outputs.cluster }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Deploy Crunchy (add PR user)
        id: crunchy
        uses: bcgov/actions-openshift/crunchy@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          oc_server: ${{ vars.OC_SERVER }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.OC_TOKEN }}
          values_file: deployments/helm/action-crunchy/values.yml
          release_name: pg-soba

  deploy:
    name: Deploy SOBA
    needs: [set-vars, build, deploy-crunchy]
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: pr
      url: ${{ needs.set-vars.outputs.URL }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout repository from pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: "4.14"

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Deploy shared Temporal and ensure PR namespace
        uses: ./.github/actions/temporal-deploy
        with:
          namespace: ${{ vars.OC_NAMESPACE }}
          temporal_namespace: soba-pr-${{ needs.set-vars.outputs.PR_NUM }}
          retention: "3d"
          chart_version: ${{ vars.TEMPORAL_CHART_VERSION || '0.74.0' }}

      - name: Get DB config from Crunchy secret
        id: db
        env:
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
          CLUSTER: ${{ needs.deploy-crunchy.outputs.cluster }}
          PR_NUM: ${{ needs.set-vars.outputs.PR_NUM }}
        run: |
          SECRET_NAME="${CLUSTER}-pguser-app-${PR_NUM}"
          echo "secret_name=$SECRET_NAME" >> "$GITHUB_OUTPUT"

      # Pipeline performance fix: Revert if needed.
      - name: Wait for PR database readiness
        uses: ./.github/actions/wait-for-postgres
        with:
          secret_name: ${{ steps.db.outputs.secret_name }}
          namespace: ${{ vars.OC_NAMESPACE }}
          label: PR database
      # Pipeline performance fix: Revert if needed.

      - name: Recover pending Helm release
        # Checkouts that predate the action skip recovery.
        if: hashFiles('.github/actions/recover-helm-release/action.yaml') != ''
        uses: ./.github/actions/recover-helm-release
        with:
          release: soba-${{ needs.set-vars.outputs.JOB_NAME }}
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Generate values override and deploy
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
          RELEASE: soba-${{ needs.set-vars.outputs.JOB_NAME }}
          TAG: sha-${{ needs.build.outputs.short_sha }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          DOMAIN: ${{ vars.OC_DOMAIN }}
          PR_NUM: ${{ needs.set-vars.outputs.PR_NUM }}
          FRONTEND_HOST: ${{ needs.set-vars.outputs.FRONTEND_HOST }}
          APS_PR_ENABLED: ${{ vars.APS_PR_ENABLED == 'true' }}
          VAULT_AUTH_PATH: ${{ vars.VAULT_AUTH_PATH }}
          VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}
          VAULT_ROLE: ${{ vars.VAULT_ROLE_NONPROD }}
          VAULT_SECRET_PATH: ${{ vars.VAULT_SECRET_PATH }}
          VAULT_SERVICE_ACCOUNT_NAME: ${{ vars.VAULT_SERVICE_ACCOUNT_NAME }}
        run: |
          # Pipeline performance fix: Revert if needed.
          set -euo pipefail
          : "${VAULT_AUTH_PATH:?Set the VAULT_AUTH_PATH variable.}"
          : "${VAULT_NAMESPACE:?Set the VAULT_NAMESPACE variable.}"
          : "${VAULT_ROLE:?Set the VAULT_ROLE_NONPROD variable.}"
          : "${VAULT_SECRET_PATH:?Set VAULT_SECRET_PATH on this environment.}"
          : "${VAULT_SERVICE_ACCOUNT_NAME:?Set the VAULT_SERVICE_ACCOUNT_NAME variable.}"
          REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          # Version /meta reports, e.g. 2.0.0-beta.0+pr.114.a1b2c3d. Empty if unreadable: the
          # chart then omits APP_VERSION and the backend falls back to package.json.
          BASE_VERSION=$(jq -r '.version // empty' backend/package.json 2>/dev/null || echo "")
          APP_VERSION=""
          if [[ "$BASE_VERSION" =~ ^[0-9A-Za-z.-]+$ ]]; then
            APP_VERSION="${BASE_VERSION}+pr.${PR_NUM}.${SHORT_SHA}"
          else
            echo "::warning::Could not read a usable version from backend/package.json; APP_VERSION unset."
          fi

          cat > /tmp/values-override.yaml <<OVERRIDE
          backend:
            image:
              repository: "ghcr.io/${REPO_LC}/backend"
              tag: "${TAG}"
            config:
              appVersion: "${APP_VERSION}"
              gitSha: "${SHORT_SHA}"
              gitTag: "${TAG}"
              imageTag: "${TAG}"
          frontend:
            image:
              repository: "ghcr.io/${REPO_LC}/frontend"
              tag: "${TAG}"
            # PRs share the dev host and are told apart by path, so pin the host and set each
            # app's path. Backend CORS_ORIGIN is derived from this host by the chart.
            host: "${FRONTEND_HOST}"
            apps:
              designer:
                routePath: "/designer-${PR_NUM}"
              forms:
                routePath: "/forms-${PR_NUM}"
          temporalWorkersImage:
            repository: "ghcr.io/${REPO_LC}/temporal-worker"
            tag: "${TAG}"
            pullPolicy: IfNotPresent
          global:
            domain: "${DOMAIN}"
            prNumber: "${PR_NUM}"
          database:
            existingSecretName: "${{ steps.db.outputs.secret_name }}"
            existingSecretKey: "uri"
          temporal:
            address: "temporal-frontend.${NAMESPACE}.svc.cluster.local:7233"
            namespace: "soba-pr-${PR_NUM}"
          valkey:
            # PR-unique Redis namespace (by PR number, not the reused slot) so a recycled slot never
            # inherits a previous PR's cached rows, bus channels or streams on the shared Valkey.
            prefix: "soba-pr-${PR_NUM}:"
          gatewayNetworkPolicy:
            enabled: ${APS_PR_ENABLED}

          OVERRIDE

          # Pipeline performance fix: Revert if needed.
          helm upgrade --install "${RELEASE}" ./deployments/helm/soba \
            --namespace "${NAMESPACE}" \
            --wait \
            --wait-for-jobs \
            --timeout 660s \
            -f deployments/helm/soba/values-pr.yaml \
            -f /tmp/values-override.yaml \
            --set-string "vault.authPath=${VAULT_AUTH_PATH}" \
            --set-string "vault.namespace=${VAULT_NAMESPACE}" \
            --set-string "vault.role=${VAULT_ROLE}" \
            --set-string "vault.secretPath=${VAULT_SECRET_PATH}" \
            --set-string "vault.serviceAccountName=${VAULT_SERVICE_ACCOUNT_NAME}"
          # Pipeline performance fix: Revert if needed.

      # Pipeline performance fix: Revert if needed.
      # Temporarily disabled openshift diagnostics; uncomment to restore.
      # - name: Deployment diagnostics
      #   if: failure()
      #   uses: ./.github/actions/openshift-diagnostics
      #   with:
      #     release: soba-${{ needs.set-vars.outputs.JOB_NAME }}
      #     namespace: ${{ vars.OC_NAMESPACE }}
      #     database_secret_name: ${{ steps.db.outputs.secret_name }}
      # Pipeline performance fix: Revert if needed.

      - name: Release Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: success()
        with:
          header: release
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          message: |
            Release ${{ github.sha }} deployed:
            - Designer (design-mode): <${{ needs.set-vars.outputs.URL }}>
            - Forms (submit-mode): <${{ needs.set-vars.outputs.URL_FORMS }}>
          number: ${{ needs.set-vars.outputs.PR_NUM }}

  gateway:
    name: Verify PR through APS gateway
    needs: [deploy, set-vars]
    if: ${{ needs.set-vars.outputs.APS_PR_ENABLED == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gateway-proxy-check.yaml
    with:
      environment: pr
      release: soba-${{ needs.set-vars.outputs.JOB_NAME }}
    secrets: inherit

  Tests:
    name: Integration Tests
    needs: [deploy, set-vars]
    # Repository variable: set PLAYWRIGHT_ENABLED=true to run integration tests.
    if: ${{ vars.PLAYWRIGHT_ENABLED == 'true' }}
    uses: ./.github/workflows/playwright.yaml
    with:
      DEP_ENV: ${{ github.event.number || github.event.inputs.pr-number }} #Passes PR number
      pr_branch: ${{ needs.set-vars.outputs.ref }} # Passes the PR branch
      BASE_URL: ${{ needs.set-vars.outputs.URL }}
    secrets:
      keycloakUsername: ${{ secrets.keycloakUsername }}
      keycloakPassword: ${{ secrets.keycloakPassword }}
      MFA_CODE: ${{ secrets.MFA_CODE }}
