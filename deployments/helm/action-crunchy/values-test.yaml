# Crunchy Postgres values for SOBA Test.
# Consumed by bcgov/actions-openshift/crunchy; must be compatible with its bundled chart.
global:
  config:
    dbName: app

crunchy:
  enabled: true
  postgresVersion: 18
  imagePullPolicy: IfNotPresent
  image: "artifacts.developer.gov.bc.ca/bcgov-docker-local/crunchy-postgres-gis:ubi9-18.1-3.6-2547"
  standby:
    enabled: false
    repoName: repo2
  shutdown: false
  clone:
    enabled: false
    s3:
      enabled: false
    pvc:
      enabled: false
    path: null
  restore:
    enabled: false
    repoName: null
    target: null
  instances:
    name: db
    replicas: 3
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9187'
    dataVolumeClaimSpec:
      # Test data and WAL volume sizes.
      storage: 20Gi
      storageClassName: netapp-block-standard
      walStorage: 2Gi
    requests:
      cpu: 150m
      memory: 1536Mi
    replicaCertCopy:
      requests:
        cpu: 1m
        memory: 32Mi
  # Backups are disabled in this Test configuration.
  pgBackRest:
    enabled: false
    s3:
      enabled: false
  patroni:
    postgresql:
      pg_hba:
        - "host all all 0.0.0.0/0 scram-sha-256"
        - "host all all ::1/128 scram-sha-256"
      parameters:
        shared_buffers: 512MB
        wal_buffers: "-1"
        min_wal_size: 128MB
        max_wal_size: 512MB
        max_slot_wal_keep_size: 1GB
        work_mem: 32MB
        log_min_duration_statement: 1000ms
        effective_io_concurrency: 20
  proxy:
    enabled: true
    pgBouncer:
      replicas: 2
      requests:
        cpu: 50m
        memory: 128Mi
      maxConnections: 100
      poolMode: transaction
  pgmonitor:
    enabled: true
    exporter:
      requests:
        cpu: 10m
        memory: 32Mi
  users:
    - name: '{{ .Values.global.config.dbName }}'
      databases:
        - '{{ .Values.global.config.dbName }}'
      options: "SUPERUSER CREATEDB CREATEROLE"
    - name: 'postgres'
      databases:
        - 'postgres'
        - '{{ .Values.global.config.dbName }}'
    - name: '{{ .Values.global.config.dbName }}proxy'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
      options: "CREATEDB CREATEROLE"
    - name: '{{ .Values.global.config.dbName }}proxytest'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
    - name: 'temporal'
      databases:
        - 'temporal'
        - 'temporal_visibility'
      options: "SUPERUSER CREATEDB CREATEROLE"
