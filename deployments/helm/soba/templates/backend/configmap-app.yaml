apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soba.fullname" . }}-backend-app
  labels:
    {{- include "soba.labels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.backend.config.logLevel | quote }}
  {{- with .Values.backend.config.httpRouteTimeoutMs }}
  HTTP_ROUTE_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.config.httpOutboundTimeoutMs }}
  HTTP_OUTBOUND_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
  NODE_ENV: {{ .Values.backend.config.nodeEnv | quote }}
  {{- $frontendOrigins := include "soba.frontendOrigins" . }}
  CORS_ORIGIN: {{ .Values.backend.config.corsOrigin | default $frontendOrigins | quote }}
  API_BASE_PATH: {{ include "soba.backendBasePath" . | quote }}
  {{- $backendApiBase := printf "https://%s%s/api/v1" (include "soba.backendHost" .) (include "soba.backendBasePath" .) }}
  SOBA_API_BASE_URL: {{ .Values.backend.config.sobaApiBaseUrl | default $backendApiBase | quote }}
  {{- if .Values.backend.config.appVersion }}
  APP_VERSION: {{ .Values.backend.config.appVersion | quote }}
  {{- end }}
  {{- if .Values.backend.config.gitSha }}
  GIT_SHA: {{ .Values.backend.config.gitSha | quote }}
  {{- end }}
  {{- if .Values.backend.config.gitTag }}
  GIT_TAG: {{ .Values.backend.config.gitTag | quote }}
  {{- end }}
  {{- if .Values.backend.config.imageTag }}
  IMAGE_TAG: {{ .Values.backend.config.imageTag | quote }}
  {{- end }}
  FORM_ENGINE_DEFAULT_CODE: {{ .Values.backend.config.formEngineDefaultCode | quote }}
  CACHE_DEFAULT_CODE: {{ .Values.backend.config.cacheDefaultCode | quote }}
  {{- if include "soba.cacheUsesRedis" . }}
  PLUGIN_CACHE_REDIS_URL: {{ printf "redis://%s-valkey:%v" (include "soba.fullname" .) .Values.valkey.port | quote }}
  # Per-release key namespace so releases sharing one Valkey (e.g. PRs in the dev namespace) never
  # read each other's cached rows. Defaults to <release>:; override with valkey.keyPrefix.
  PLUGIN_CACHE_REDIS_KEY_PREFIX: {{ .Values.valkey.keyPrefix | default .Values.valkey.prefix | default (printf "%s:" (include "soba.fullname" .)) | quote }}
  {{- end }}
  MESSAGEBUS_DEFAULT_CODE: {{ .Values.backend.config.messagebusDefaultCode | quote }}
  {{- if include "soba.messagebusUsesRedis" . }}
  PLUGIN_MESSAGEBUS_REDIS_URL: {{ printf "redis://%s-valkey:%v" (include "soba.fullname" .) .Values.valkey.port | quote }}
  # Per-release channel namespace so releases sharing one Valkey (e.g. PRs in the dev namespace)
  # never receive each other's events. Defaults to <release>:; override with valkey.channelPrefix.
  PLUGIN_MESSAGEBUS_REDIS_CHANNEL_PREFIX: {{ .Values.valkey.channelPrefix | default .Values.valkey.prefix | default (printf "%s:" (include "soba.fullname" .)) | quote }}
  {{- end }}
  EVENTSTREAM_DEFAULT_CODE: {{ .Values.backend.config.eventStreamDefaultCode | quote }}
  {{- if include "soba.eventstreamUsesRedis" . }}
  PLUGIN_EVENTSTREAM_REDIS_URL: {{ printf "redis://%s-valkey:%v" (include "soba.fullname" .) .Values.valkey.port | quote }}
  # Per-release stream namespace so releases sharing one Valkey never read each other's streams or
  # share consumer groups. Defaults to <release>:; override with valkey.streamPrefix.
  PLUGIN_EVENTSTREAM_REDIS_STREAM_PREFIX: {{ .Values.valkey.streamPrefix | default .Values.valkey.prefix | default (printf "%s:" (include "soba.fullname" .)) | quote }}
  {{- end }}
  TEMPSTORAGE_DEFAULT_CODE: {{ .Values.backend.config.tempStorageDefaultCode | quote }}
  {{- if include "soba.tempStorageUsesMount" . }}
  PLUGIN_TEMPSTORAGE_MOUNT_DIR: {{ .Values.backend.tempStorage.mountPath | quote }}
  {{- end }}
  VIRUSSCAN_DEFAULT_CODE: {{ .Values.backend.config.virusScanDefaultCode | quote }}
  {{- if include "soba.virusScanUsesClamav" . }}
  PLUGIN_VIRUSSCAN_CLAMAV_URL: {{ printf "%s-clamav:%v" (include "soba.fullname" .) .Values.clamav.port | quote }}
  PLUGIN_VIRUSSCAN_CLAMAV_TIMEOUT_MS: {{ .Values.clamav.timeoutMs | quote }}
  {{- end }}
  SOBA_SYSTEM_SUBJECT: {{ .Values.backend.config.sobaSystemSubject | quote }}
  {{- with include "soba.optionalSetting" .Values.backend.config.postSubmissionActionPlugins }}
  POST_SUBMISSION_ACTION_PLUGINS: {{ . }}
  {{- end }}
  {{- with include "soba.hourlyEmailLimit" (dict "name" "postSubmissionEmailFormHourlyLimit" "value" .Values.backend.config.postSubmissionEmailFormHourlyLimit) }}
  PLUGIN_POST_SUBMISSION_EMAIL_ADDRESSES_FORM_HOURLY_LIMIT: {{ . }}
  {{- end }}
  {{- with include "soba.hourlyEmailLimit" (dict "name" "postSubmissionEmailWorkspaceHourlyLimit" "value" .Values.backend.config.postSubmissionEmailWorkspaceHourlyLimit) }}
  PLUGIN_POST_SUBMISSION_EMAIL_ADDRESSES_WORKSPACE_HOURLY_LIMIT: {{ . }}
  {{- end }}
  {{- with include "soba.hourlyEmailLimit" (dict "name" "postSubmissionEmailEnvironmentHourlyLimit" "value" .Values.backend.config.postSubmissionEmailEnvironmentHourlyLimit) }}
  PLUGIN_POST_SUBMISSION_EMAIL_ADDRESSES_ENVIRONMENT_HOURLY_LIMIT: {{ . }}
  {{- end }}
  {{- with include "soba.optionalSetting" .Values.backend.config.shutdownDelayMs }}
  SHUTDOWN_DELAY_MS: {{ . }}
  {{- end }}
  {{- with include "soba.optionalSetting" .Values.backend.config.shutdownTimeoutMs }}
  SHUTDOWN_TIMEOUT_MS: {{ . }}
  {{- end }}
  {{- with include "soba.optionalSetting" .Values.backend.config.submissionExportActiveLimit }}
  SUBMISSION_EXPORT_ACTIVE_LIMIT: {{ . }}
  {{- end }}
  {{- $jobEnv := dict
      "pools" "JOB_POOLS"
      "lightPollMs" "JOB_LIGHT_POLL_MS"
      "heavyPollMs" "JOB_HEAVY_POLL_MS"
      "lightLeaseMs" "JOB_LIGHT_LEASE_MS"
      "heavyLeaseMs" "JOB_HEAVY_LEASE_MS"
      "lightConcurrency" "JOB_LIGHT_CONCURRENCY"
      "heavyConcurrency" "JOB_HEAVY_CONCURRENCY"
      "lightTimeoutMs" "JOB_LIGHT_TIMEOUT_MS"
      "heavyTimeoutMs" "JOB_HEAVY_TIMEOUT_MS"
      "maxAttempts" "JOB_MAX_ATTEMPTS"
      "backoffBaseMs" "JOB_BACKOFF_BASE_MS"
      "backoffMaxMs" "JOB_BACKOFF_MAX_MS"
      "sweepIntervalMs" "JOB_SWEEP_INTERVAL_MS"
      "retentionBatch" "JOB_RETENTION_BATCH"
      "succeededRetentionDays" "JOB_SUCCEEDED_RETENTION_DAYS"
      "deadRetentionDays" "JOB_DEAD_RETENTION_DAYS"
      "drainMs" "JOB_DRAIN_MS"
      "abortGraceMs" "JOB_ABORT_GRACE_MS"
      "progressIntervalMs" "JOB_PROGRESS_INTERVAL_MS"
      "resultMaxBytes" "JOB_RESULT_MAX_BYTES"
      "resultRetentionDays" "JOB_RESULT_RETENTION_DAYS"
      "resultSweepBatch" "JOB_RESULT_SWEEP_BATCH" }}
  {{- range $key, $name := $jobEnv }}
  {{- with include "soba.optionalSetting" (index $.Values.backend.jobs $key) }}
  {{ $name }}: {{ . }}
  {{- end }}
  {{- end }}
  {{- if not .Values.database.uri }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  {{- end }}
  DB_ADMIN_DATABASE: {{ .Values.database.adminDatabase | quote }}
  DB_POOL_MAX: {{ .Values.database.poolMax | quote }}
  # Pipeline performance fix: Revert if needed.
  DB_CONNECTION_TIMEOUT_MS: {{ .Values.database.connectionTimeoutMs | quote }}
  DB_QUERY_TIMEOUT_MS: {{ .Values.database.queryTimeoutMs | quote }}
  DB_STATEMENT_TIMEOUT_MS: {{ .Values.database.statementTimeoutMs | quote }}
  DB_LOCK_TIMEOUT_MS: {{ .Values.database.lockTimeoutMs | quote }}
  DB_MIGRATION_READY_ATTEMPTS: {{ .Values.database.migrationReadyAttempts | quote }}
  DB_MIGRATION_READY_SLEEP_MS: {{ .Values.database.migrationReadySleepMs | quote }}
  # Frontend app URLs, for links the backend composes (email) and for /meta/frontend-config.
  DESIGNER_APP_URL: {{ include "soba.frontendAppUrlFor" (dict "root" . "name" "designer") | quote }}
  FORMS_APP_URL: {{ include "soba.frontendAppUrlFor" (dict "root" . "name" "forms") | quote }}
