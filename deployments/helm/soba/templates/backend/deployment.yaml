apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soba.fullname" . }}-backend
  labels:
    {{- include "soba.labels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "soba.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config-app: {{ include (print .Template.BasePath "/backend/configmap-app.yaml") . | sha256sum }}
        checksum/config-formio: {{ include (print .Template.BasePath "/backend/configmap-formio.yaml") . | sha256sum }}
        checksum/config-document-generation: {{ include (print .Template.BasePath "/backend/configmap-document-generation.yaml") . | sha256sum }}
        checksum/config-credential-issuer: {{ include (print .Template.BasePath "/backend/configmap-credential-issuer.yaml") . | sha256sum }}
        checksum/config-tenant-engine: {{ include (print .Template.BasePath "/backend/configmap-tenant-engine.yaml") . | sha256sum }}
        checksum/config-workflow-engine: {{ include (print .Template.BasePath "/backend/configmap-workflow-engine.yaml") . | sha256sum }}
        checksum/config-notification: {{ include (print .Template.BasePath "/backend/configmap-notification.yaml") . | sha256sum }}
        checksum/config-user-search: {{ include (print .Template.BasePath "/backend/configmap-user-search.yaml") . | sha256sum }}
        checksum/config-sso: {{ include (print .Template.BasePath "/backend/configmap-sso.yaml") . | sha256sum }}
        checksum/config-ratelimit: {{ include (print .Template.BasePath "/backend/configmap-ratelimit.yaml") . | sha256sum }}
        checksum/config-storage: {{ include (print .Template.BasePath "/backend/configmap-storage.yaml") . | sha256sum }}
        checksum/secret-db: {{ include (print .Template.BasePath "/secrets/db-secret.yaml") . | sha256sum }}
        {{- if not .Values.vault.enabled }}
        checksum/secret-formio: {{ include (print .Template.BasePath "/secrets/formio-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/agent-pre-populate-only: 'true'
        vault.hashicorp.com/auth-path: {{ .Values.vault.authPath | quote }}
        vault.hashicorp.com/namespace: {{ .Values.vault.namespace | quote }}
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-requests-cpu: '10m'
        vault.hashicorp.com/agent-limits-cpu: '50m'
        vault.hashicorp.com/agent-requests-mem: '25Mi'
        vault.hashicorp.com/agent-limits-mem: '75Mi'
        vault.hashicorp.com/error-on-missing-key-soba-formio: 'true'
        vault.hashicorp.com/agent-inject-secret-soba-formio: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-soba-formio: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          {{`export ROOT_PASSWORD="{{ .Data.data.FORMIO_ADMIN_PASSWORD }}"`}}
          {{`export PLUGIN_FORMIO_V5_ADMIN_PASSWORD="{{ .Data.data.FORMIO_ADMIN_PASSWORD }}"`}}
          {{`export FORMIO_JWT_SECRET="{{ .Data.data.FORMIO_JWT_SECRET }}"`}}
          {{`{{- end }}`}}
        vault.hashicorp.com/error-on-missing-key-soba-cdogs: 'true'
        vault.hashicorp.com/agent-inject-secret-soba-cdogs: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-soba-cdogs: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          {{`export PLUGIN_CDOGS_V2_CLIENT_ID="{{ .Data.data.PLUGIN_CDOGS_V2_CLIENT_ID }}"`}}
          {{`export PLUGIN_CDOGS_V2_CLIENT_SECRET="{{ .Data.data.PLUGIN_CDOGS_V2_CLIENT_SECRET }}"`}}
          {{`{{- end }}`}}
        vault.hashicorp.com/error-on-missing-key-soba-workflow: 'true'
        vault.hashicorp.com/agent-inject-secret-soba-workflow: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-soba-workflow: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          {{`export PLUGIN_CS_WORKFLOW_V1_API_KEY="{{ .Data.data.PLUGIN_CS_WORKFLOW_V1_API_KEY }}"`}}
          {{`{{- end }}`}}
        vault.hashicorp.com/error-on-missing-key-soba-notify: 'true'
        vault.hashicorp.com/agent-inject-secret-soba-notify: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-soba-notify: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          {{`export PLUGIN_NOTIFY_V1_API_KEY="{{ .Data.data.PLUGIN_NOTIFY_V1_API_KEY }}"`}}
          {{`{{- end }}`}}
        {{- if eq .Values.backend.config.credentialIssuerDefaultCode "aps-credential-issuer-v3" }}
        vault.hashicorp.com/error-on-missing-key-soba-aps-credential-issuer: 'true'
        vault.hashicorp.com/agent-inject-secret-soba-aps-credential-issuer: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-soba-aps-credential-issuer: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          {{`export PLUGIN_APS_CREDENTIAL_ISSUER_V3_CLIENT_ID="{{ .Data.data.PLUGIN_APS_CREDENTIAL_ISSUER_V3_CLIENT_ID }}"`}}
          {{`export PLUGIN_APS_CREDENTIAL_ISSUER_V3_CLIENT_SECRET="{{ .Data.data.PLUGIN_APS_CREDENTIAL_ISSUER_V3_CLIENT_SECRET }}"`}}
          {{`export PLUGIN_APS_CREDENTIAL_ISSUER_V3_ENVIRONMENT_APP_ID="{{ .Data.data.PLUGIN_APS_CREDENTIAL_ISSUER_V3_ENVIRONMENT_APP_ID }}"`}}
          {{`{{- end }}`}}
        {{- end }}
        {{- if include "soba.userSearchUsesCss" . }}
        vault.hashicorp.com/error-on-missing-key-soba-css: 'true'
        vault.hashicorp.com/agent-inject-secret-soba-css: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-soba-css: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          {{`export PLUGIN_CSS_V1_CLIENT_ID="{{ .Data.data.PLUGIN_CSS_V1_CLIENT_ID }}"`}}
          {{`export PLUGIN_CSS_V1_CLIENT_SECRET="{{ .Data.data.PLUGIN_CSS_V1_CLIENT_SECRET }}"`}}
          {{`{{- end }}`}}
        {{- end }}
        {{- if include "soba.storageUsesS3Vault" . }}
        {{- $s3 := upper .Values.backend.storage.s3VaultKeyInfix }}
        vault.hashicorp.com/error-on-missing-key-soba-s3: 'true'
        vault.hashicorp.com/agent-inject-secret-soba-s3: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-soba-s3: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          {{`export STORAGE_PROFILE_DEFAULT_ACCESS_KEY="{{ .Data.data.S3_`}}{{ $s3 }}{{`_ACCESS_KEY_ID }}"`}}
          {{`export STORAGE_PROFILE_DEFAULT_SECRET_KEY="{{ .Data.data.S3_`}}{{ $s3 }}{{`_ACCESS_SECRET_KEY }}"`}}
          {{`export STORAGE_PROFILE_DEFAULT_BUCKET_NAME="{{ .Data.data.S3_`}}{{ $s3 }}{{`_BUCKET_NAME }}"`}}
          {{`export STORAGE_PROFILE_DEFAULT_ENDPOINT="{{ .Data.data.S3_`}}{{ $s3 }}{{`_ENDPOINT }}"`}}
          {{`{{- end }}`}}
        {{- end }}
        {{- end }}
      labels:
        {{- include "soba.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
    spec:
      {{- if .Values.vault.enabled }}
      serviceAccountName: {{ .Values.vault.serviceAccountName | quote }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          {{- if .Values.vault.enabled }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              . /vault/secrets/soba-formio
              . /vault/secrets/soba-cdogs
              . /vault/secrets/soba-workflow
              . /vault/secrets/soba-notify
              {{- if eq .Values.backend.config.credentialIssuerDefaultCode "aps-credential-issuer-v3" }}
              . /vault/secrets/soba-aps-credential-issuer
              {{- end }}
              {{- if include "soba.storageUsesS3Vault" . }}
              . /vault/secrets/soba-s3
              {{- end }}
              {{- if include "soba.userSearchUsesCss" . }}
              . /vault/secrets/soba-css
              {{- end }}
              exec node backend/dist/src/app.js
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-credential-issuer
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-app
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-formio
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-document-generation
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-tenant-engine
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-workflow-engine
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-notification
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-user-search
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-sso
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-ratelimit
            - configMapRef:
                name: {{ include "soba.fullname" . }}-backend-storage
            {{- if not .Values.database.existingSecretName }}
            - secretRef:
                name: {{ include "soba.fullname" . }}-db
            {{- end }}
            {{- if not .Values.vault.enabled }}
            - secretRef:
                name: {{ include "soba.fullname" . }}-formio
            {{- end }}
          {{- if .Values.database.runtimeSecretName }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "soba.runtimeDbSecretName" . }}
                  key: {{ include "soba.runtimeDbSecretKey" . }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ include "soba.backendBasePath" . }}/api/v1/health
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ include "soba.backendBasePath" . }}/api/v1/health
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if or (include "soba.tempStorageUsesMount" .) (include "soba.storageUsesLocal" .) }}
          volumeMounts:
            {{- if include "soba.tempStorageUsesMount" . }}
            - name: app-tmp
              mountPath: {{ .Values.backend.tempStorage.mountPath }}
            {{- end }}
            {{- if include "soba.storageUsesLocal" . }}
            - name: app-filestore
              mountPath: {{ .Values.backend.storage.defaultBasePath }}
            {{- end }}
          {{- end }}
      {{- if or (include "soba.tempStorageUsesMount" .) (include "soba.storageUsesLocal" .) }}
      volumes:
        {{- if include "soba.tempStorageUsesMount" . }}
        - name: app-tmp
          persistentVolumeClaim:
            claimName: {{ include "soba.fullname" . }}-backend-tmp
        {{- end }}
        {{- if include "soba.storageUsesLocal" . }}
        - name: app-filestore
          persistentVolumeClaim:
            claimName: {{ include "soba.fullname" . }}-backend-filestore
        {{- end }}
      {{- end }}
