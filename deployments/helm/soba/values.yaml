global:
  domain: apps.gov.bc.ca
  namespace: ""
  # Set true to remove "keep" policy on Secrets/PVCs (e.g. PR teardown)
  forceCleanup: false
  # PR number a deployment belongs to, for provenance when several PR releases share a namespace.
  prNumber: ""

# Opt-in access from APS to backend pods only. namespaceName is the APS namespace label (Silver:
# 264e6f, Gold: b8840c); environment is test or prod, matching the APS instance publishing the route.
gatewayNetworkPolicy:
  enabled: false
  namespaceName: ""
  environment: ""

# -- Backend (Express API) ------------------------------------------------
backend:
  image:
    repository: ghcr.io/bcgov/soba/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    port: 4000
  # URL path the API is served under. The app serves it, so Routes, probes and the advertised API
  # URLs all use it as-is. Every environment shares this path; the host keeps deployments apart.
  basePath: /chefs
  route:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    # Router tuning for the API host; see README.
    annotations:
      # Inactivity timeout. The router's 30s default is tight for the synchronous CDOGS
      # call under /{submit,design}/submissions/:id/print, which cannot be scoped below.
      haproxy.router.openshift.io/timeout: "60s"
      # The router sets a session cookie on edge routes whether or not we ask; this just
      # names it. sobaFetch sends no credentials, so nothing returns it on this host.
      router.openshift.io/cookie_name: "soba-affinity"
    # Path-scoped Routes on the same host, annotations merged over the ones above. Paths are
    # relative to backend.basePath, which the template prepends.
    extraPaths:
      - name: files
        path: /api/v1/submit/files
        annotations:
          # Upload is silent through the clamd scan (clamav.timeoutMs, 60s).
          haproxy.router.openshift.io/timeout: "300s"
      - name: files-api
        path: /api/v1/files
        annotations:
          # Upload is silent through the clamd scan (clamav.timeoutMs, 60s).
          haproxy.router.openshift.io/timeout: "300s"
      - name: templates
        path: /api/v1/templates
        annotations:
          # Upload is silent through the clamd scan (clamav.timeoutMs, 60s).
          haproxy.router.openshift.io/timeout: "300s"
      - name: print-upload
        path: /api/v1/design/print-upload
        annotations:
          # Upload is silent through the clamd scan (clamav.timeoutMs, 60s).
          haproxy.router.openshift.io/timeout: "300s"
  ingress:
    enabled: false
    ingressClassName: ""
    # ingress-nginx only; other controllers ignore these.
    annotations:
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/session-cookie-name: "soba-affinity"
    tls: false
    tlsSecretName: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  # -- pre-install/pre-upgrade Job: runs drizzle migrate + seed
  migration:
    enabled: true
    activeDeadlineSeconds: 300

  # -- per-environment feature status, rendered into the migration Job (which runs the seed).
  # Each key becomes FEATURE_<CODE>_STATUS. "" leaves the migration's value alone; otherwise any
  # feature_status code (enabled, disabled, experimental, deprecated), quoted. Anything else fails
  # the render. dev-data must stay off in production.
  features:
    dev-data: ""
    notifications: ""
    post-submission: ""
    post-submission-email: ""
    submission-export: ""
    user-search: ""

  # -- configmap-app: general application config
  config:
    logLevel: info
    # httpRouteTimeoutMs matches the route annotation above. httpOutboundTimeoutMs defaults to
    # half of it; per-plugin TIMEOUT_MS overrides both.
    httpRouteTimeoutMs: ""
    httpOutboundTimeoutMs: ""
    nodeEnv: production
    # Allowed origin(s) for CORS (comma-separated). Defaults to frontend URL when unset.
    corsOrigin: ""
    # Base URL for this API (returned in /api/v1/meta/frontend-config). Defaults to backend public URL when unset.
    sobaApiBaseUrl: ""
    # Build meta (returned in /api/v1/meta/build). Set from CI (e.g. workflow override).
    # appVersion is what /meta reports: the package.json version plus build metadata
    # (e.g. 2.0.0-beta.0+pr.114.a1b2c3d). Unset falls back to the version baked into the image.
    appVersion: ""
    gitSha: ""
    gitTag: ""
    imageTag: ""
    formEngineDefaultCode: formio-v5
    # Cache plugin. Default cache-memory (per-pod). Set cache-redis in a per-env values file
    # (values-<env>.yaml) once that namespace's Valkey chart is deployed and confirmed reachable —
    # cache-redis without a reachable Valkey is worse than cache-memory (no caching, warn per
    # reconnect). See the valkey block below for the shared-cache wiring.
    # Document generation backend code the consumer defaults to.
    documentGenerationDefaultCode: docgen-noop
    cacheDefaultCode: cache-memory
    messagebusDefaultCode: messagebus-memory
    eventStreamDefaultCode: eventstream-memory
    # Temp storage plugin. Default tempstorage-os stages temp bytes under
    # os.tmpdir() (per-pod, no PVC). Override to tempstorage-mount for a shared
    # RWX PVC across replicas (see the tempStorage block below).
    tempStorageDefaultCode: tempstorage-os
    # Virus scan plugin. Deployments scan for real against the shared clamav
    # (see the clamav block below); local dev overrides to virusscan-noop via .env.
    virusScanDefaultCode: virusscan-clamav
    # Tenant engine behind GET /me/tenants. tenant-noop returns no tenants and calls nothing.
    tenantEngineDefaultCode: tenant-noop
    # Workflow engine. workflow-noop starts nothing and calls nothing.
    workflowEngineDefaultCode: workflow-noop
    # Notification plugin. notification-noop sends nothing and calls nothing.
    notificationDefaultCode: notification-noop
    # notificationDefaultCode: notify-v1
    # User search plugins, comma-separated, in merge order. Empty enables none.
    # user-search-soba searches Soba's own users and needs no config. css-v1 injects the CSS
    # credentials from Vault, so the secret must hold them.
    userSearchPlugins: user-search-soba
    # Post-submission action plugins this environment runs, comma-separated. Empty runs none.
    postSubmissionActionPlugins: ""
    # post-submission-email-addresses: emails allowed per hour, per form, per workspace and for the
    # whole environment, each from 100 to 1000000. "" uses the defaults (500, 2000 and 5000).
    postSubmissionEmailFormHourlyLimit: ""
    postSubmissionEmailWorkspaceHourlyLimit: ""
    postSubmissionEmailEnvironmentHourlyLimit: ""
    sobaSystemSubject: soba-system
    # On SIGTERM the backend keeps serving for shutdownDelayMs, or until running jobs drain if that
    # takes longer (see jobs.drainMs), then closes the server and exits by shutdownTimeoutMs; keep
    # that under the pod's 30 s grace period. "" uses the defaults in code (5000 and 28000).
    shutdownDelayMs: ""
    shutdownTimeoutMs: ""
    # Queued or running submission exports one form may have (default 2).
    submissionExportActiveLimit: ""

  # -- configmap-app: background job runner (JOB_*). "" uses the default in code.
  jobs:
    # Pools this pod runs, comma-separated (light, heavy). Default: both.
    pools: ""
    lightPollMs: ""
    heavyPollMs: ""
    lightLeaseMs: ""
    heavyLeaseMs: ""
    lightConcurrency: ""
    heavyConcurrency: ""
    lightTimeoutMs: ""
    heavyTimeoutMs: ""
    maxAttempts: ""
    backoffBaseMs: ""
    backoffMaxMs: ""
    sweepIntervalMs: ""
    retentionBatch: ""
    succeededRetentionDays: ""
    deadRetentionDays: ""
    # Shutdown waits drainMs for running jobs, then abortGraceMs for aborted ones to stop, then up to
    # 3 s for their outcomes to be written; only then does the server close. Startup fails unless
    # that total is under config.shutdownTimeoutMs; the defaults (15 + 2 + 3 s of 28 s) leave 8 s.
    drainMs: ""
    abortGraceMs: ""
    # Least time between a running job's progress writes (at least 1000).
    progressIntervalMs: ""
    # Largest result file a job may store, in bytes (default 200 MiB). A larger one fails the job.
    resultMaxBytes: ""
    # Days a job's result file is kept (default 7), and result files removed per sweep.
    resultRetentionDays: ""
    resultSweepBatch: ""

  # -- Shared temp storage PVC (RWX so it survives horizontal scaling).
  # Only provisioned/mounted when config.tempStorageDefaultCode is
  # tempstorage-mount; mountPath doubles as the plugin's DIR. Ignored otherwise.
  tempStorage:
    mountPath: /app/tmp
    accessMode: ReadWriteMany
    size: 1Gi
    storageClassName: ""

  # -- configmap-storage: files and templates features + storage profiles (STORAGE_* + FILES_* +
  # TEMPLATES_*)
  storage:
    # Active storage profiles (comma-separated). Each needs a *Backend below.
    profiles: "default"
    # Backend for the 'default' profile. 'storage-memory' is in-process and ephemeral — no PVC,
    # no external service, lost on restart, per-replica. Fine for ephemeral (PR) namespaces, and
    # refused with more than one replica or with autoscaling.
    # 'storage-local' keeps files on the RWX PVC below (localVolume, defaultBasePath).
    # For durable, multi-replica environments override to 'storage-s3' and set the endpoint, bucket
    # and prefix below (credentials come from a Secret).
    defaultBackend: storage-memory
    # Profile the /files API reads/writes, and the max upload size it accepts (MB).
    filesStorageProfile: "default"
    filesMaxFileSizeMb: "10"
    # Profile the /templates API reads/writes, and the max upload size it accepts (MB).
    templatesStorageProfile: "default"
    templatesMaxFileSizeMb: "10"
    # Key prefixes the features store under within their profiles. Empty uses the defaults in code
    # (attachments, templates).
    filesStoragePrefix: ""
    templatesStoragePrefix: ""
    # Profile and key prefix for files background jobs produce, such as submission exports. Empty
    # uses the defaults in code (default, job-results).
    jobResultsStorageProfile: ""
    jobResultsStoragePrefix: ""

    # storage-local only: where the file store PVC is mounted and the default profile writes.
    # Required for storage-local.
    defaultBasePath: ""
    # storage-local only: the file store PVC, created only when defaultBackend is storage-local.
    # ReadWriteMany, shared by every replica.
    localVolume:
      accessMode: ReadWriteMany
      size: 1Gi
      storageClassName: ""

    # storage-s3 only — non-credential keys, rendered only when set. ACCESS_KEY/SECRET_KEY are
    # NOT here; supply them via a Secret. A URL endpoint sets the SSL flag, and its port when it has
    # one, else defaultPort, else the scheme's default (443 or 80); defaultUseSsl is ignored. A host
    # endpoint takes defaultUseSsl, and defaultPort or 9000.
    defaultEndpoint: ""
    defaultBucketName: ""
    defaultPort: ""
    defaultUseSsl: ""
    # Root every object in the default profile is stored under. Required for storage-s3. Unique per
    # environment, not inside another environment's root, and fixed once files are stored.
    defaultPrefix: ""
    # Vault key infix for the S3 secrets: S3_<infix>_ACCESS_KEY_ID, _ACCESS_SECRET_KEY, _BUCKET_NAME
    # and _ENDPOINT (infix e.g. PR, DEV, TEST, UAT, PROD). Used only with storage-s3 and vault.enabled.
    s3VaultKeyInfix: ""

  # -- configmap-formio: PLUGIN_FORMIO_V5_* (non-secret values)
  formio:
    routesAllowed: "true"
    proxyPath: /formio-v5
    # apiBaseUrl is auto-constructed from the formio service/external URL
    # -- outbound deadline in ms; empty uses the backend default (30000)
    timeoutMs: ""

  # -- configmap-document-generation: PLUGIN_CDOGS_* + default backend code
  documentGeneration:
    # -- renders one pod runs at once; empty uses the backend default (2)
    maxConcurrent: ""
    cdogsV2:
      endpoint: ""
      tokenUrl: ""
      # -- outbound deadline in ms; empty uses the backend default (30000)
      timeoutMs: ""
    cdogsV3:
      # -- gold cluster-local service; does not resolve from other clusters
      endpoint: http://common-document-generation-service-master.b82f30-prod:3000
      # -- outbound deadline in ms; empty uses the backend default (30000)
      timeoutMs: ""

  # -- configmap-user-search: PLUGIN_CSS_V1_* + enabled plugin codes
  userSearch:
    cssV1:
      apiBaseUrl: ""
      # -- CSS environment searched: dev, test or prod
      environment: ""
      tokenUrl: ""
      # -- outbound deadline in ms; empty uses the backend default (30000)
      timeoutMs: ""

  # -- configmap-tenant-engine: PLUGIN_CSTAR_V1_* + default engine code
  tenantEngine:
    cstarV1:
      apiBaseUrl: ""
      # -- outbound deadline in ms; empty uses the backend default (30000)
      timeoutMs: "5000"

  # -- configmap-workflow-engine: PLUGIN_CS_WORKFLOW_V1_* + default engine code
  workflowEngine:
    csWorkflowV1:
      apiBaseUrl: ""
      # -- outbound deadline in ms; empty uses the backend default (30000)
      timeoutMs: "5000"

  # -- configmap-notification: PLUGIN_NOTIFY_V1_* + default notification code
  notification:
    notifyV1:
      # -- Notify base URL including /api/v1
      endpoint: ""
      # -- outbound deadline in ms; empty uses the backend default (30000)
      timeoutMs: ""

  # -- configmap-sso: IDP / SSO config
  sso:
    idpPluginDefaultCode: bcgov-sso
    idpPlugins: bcgov-sso
    jwksUri: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs
    jwtIssuer: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    jwtAudience: connected-services-submit-6349

  # -- configmap-ratelimit: RATE_LIMIT_*
  rateLimit:
    windowMs: "60000"
    max: "100"
    apiWindowMs: "60000"
    apiMax: "60"
    publicWindowMs: "60000"
    publicMax: "200"
    renderWindowMs: "60000"
    renderMax: "30"

# -- Frontend (Next.js) ---------------------------------------------------
frontend:
  image:
    repository: ghcr.io/bcgov/soba/frontend
    tag: latest
    pullPolicy: IfNotPresent
  # Host shared by every app; they are told apart by routePath. Blank = <fullname>.<domain>.
  host: ""
  replicas: 1
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    port: 3000
  route:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    # Applied to every app's Route; frontend.apps.<name>.route.annotations overrides per app.
    annotations:
      # Names the session cookie the router already sets on edge routes.
      router.openshift.io/cookie_name: "soba-affinity"
  ingress:
    enabled: false
    ingressClassName: ""
    # ingress-nginx only; other controllers ignore these. Shared by every app.
    annotations:
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/session-cookie-name: "soba-affinity"
    tls: false
    tlsSecretName: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  # Optional: override SOBA_API_INTERNAL_URL (Next SSR → API). Default: in-cluster http://<release>-backend.<namespace>.svc.cluster.local:<port>/api/v1
  internalApiBaseUrl: ""
  # Named frontend apps: one Deployment/Service/Route/ConfigMap each, mode set by featuresAllowed
  # (codes from GET /meta/features, or * / all) and URL by routePath. They share one host and one
  # image repository; the tag carries the app name, because basePath is baked per build.
  # All other frontend.* settings (image, probes, resources, route.tls, autoscaling) are shared.
  apps:
    designer:
      enabled: true
      featuresAllowed: "design-mode,files,meta,marketing,templates,user-search,submission-export"
      routePath: /designer
    forms:
      enabled: true
      featuresAllowed: "submit-mode,files,meta,templates"
      routePath: /forms

# -- Database (external Postgres) -----------------------------------------
database:
  # Option 1: full URI (takes precedence)
  uri: ""
  # Pipeline performance fix: Revert if needed.
  existingSecretName: ""
  existingSecretKey: "uri"
  # Pipeline performance fix: Revert if needed.
  # Option 2: components (used when uri is empty)
  host: ""
  port: "5432"
  user: postgres
  # password: unset generates one in the db secret
  name: soba
  adminDatabase: postgres
  poolMax: "10"
  # Pipeline performance fix: Revert if needed.
  connectionTimeoutMs: "10000"
  queryTimeoutMs: "60000"
  statementTimeoutMs: "60000"
  lockTimeoutMs: "10000"
  migrationReadyAttempts: "5"
  migrationReadySleepMs: "5000"
  # Pipeline performance fix: Revert if needed.

# -- Form.io ---------------------------------------------------------------
formio:
  internal:
    enabled: true
  external:
    url: ""
  image:
    # Pull official images through Google's Docker Hub mirror to avoid the anonymous pull-rate
    # limit on the cluster (same image, matching digest).
    repository: mirror.gcr.io/formio/formio
    tag: 4.11.0
    pullPolicy: IfNotPresent
  replicas: 1
  # Heap cap kept below the memory limit so Node GCs before the container is OOM-killed.
  nodeOptions: "--max-old-space-size=384"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  service:
    port: 3001
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  admin:
    email: formio@soba.gov.bc.ca
    # password: unset generates one in the formio secret
  jwtSecret: ""

# -- MongoDB (backing store for Form.io) -----------------------------------
mongodb:
  internal:
    enabled: true
  external:
    uri: ""
    host: ""
    authSecretName: ""
    port: 27017
    username: formio
    database: formio-ce
    authSource: formio-ce
    replicaSet: rs0
  image:
    # Google's Docker Hub mirror — avoids the anonymous pull-rate limit on the cluster (same
    # image, matching digest).
    repository: mirror.gcr.io/library/mongo
    tag: "7"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  service:
    port: 27017
  persistence:
    size: 1Gi
    storageClassName: ""

# -- ClamAV endpoint (alias to the separately-deployed clamav) ----------------
# ClamAV runs as its own chart (deployments/helm/clamav), one per namespace. The
# backend always targets an in-namespace ExternalName Service <release>-clamav on
# the URL <release>-clamav:port, so backend config never changes per env — only
# externalName (the real clamav Service) does. The alias Service + the backend
# wiring are created only when backend.config.virusScanDefaultCode == virusscan-clamav.
clamav:
  # Real clamav Service the <release>-clamav alias points at. Empty defaults to the
  # clamav Service in THIS namespace; override for cross-namespace (e.g. a PR in its
  # own namespace pointing at dev's clamav).
  externalName: ""
  port: 3310
  timeoutMs: "60000"

# -- Valkey endpoint (alias to the separately-deployed valkey) ----------------
# Valkey (Redis-compatible) runs as its own chart (deployments/helm/valkey), one per namespace,
# providing the shared cache, message bus and event streams (tune its persistence/eviction in the
# valkey chart per what it hosts). The backend always targets an in-namespace
# <release>-valkey alias Service on redis://<release>-valkey:port, so backend config never changes
# per env — only externalName does. The alias Service is created when either cacheDefaultCode ==
# cache-redis or messagebusDefaultCode == messagebus-redis; each plugin's PLUGIN_*_REDIS_* env is
# emitted only when that plugin is on redis.
valkey:
  # Real valkey Service the <release>-valkey alias points at. Empty defaults to the valkey Service
  # in THIS namespace; override for cross-namespace (e.g. a PR pointing at dev's valkey).
  externalName: ""
  port: 6379
  # Umbrella namespace for ALL Redis uses (cache keys, bus channels, streams) on a shared Valkey.
  # Empty = per-release prefix (<release>:). Set this to a caller-unique value (e.g. per PR number,
  # not the reused deploy slot) so short-lived releases that recycle names never collide. The
  # per-capability *Prefix values below override it when set.
  prefix: ""
  # Optional key namespace, so releases sharing a Valkey never collide on cache keys. Empty =
  # per-release prefix (<release>:), set by the backend configmap.
  keyPrefix: ""
  # Optional channel namespace, so releases sharing a Valkey never receive each other's bus events.
  # Empty = per-release prefix (<release>:), set by the backend configmap.
  channelPrefix: ""
  # Optional stream namespace, so releases sharing a Valkey never read each other's event streams or
  # share consumer groups. Empty = per-release prefix (<release>:), set by the backend configmap.
  streamPrefix: ""

# -- Temporal (shared server, env vars for backend + worker) ------------------
temporal:
  allowed: "false"
  address: ""
  namespace: "default"
  taskQueue: "soba"

# -- Temporal workers (dedicated image with glibc for @temporalio/core-bridge) --
# Shared by every entry in temporalWorkers; a worker may override it with its own `image` block.
temporalWorkersImage:
  repository: ghcr.io/bcgov/soba/temporal-worker
  tag: latest
  pullPolicy: IfNotPresent

# Helm replaces lists rather than merging them, so an environment values file that sets
# temporalWorkers must restate every worker it wants — entries added here alone reach nothing.
temporalWorkers:
  - name: temporal-worker
    enabled: false
    taskQueue: "soba"
    replicas: 1
    # Port for the worker's HTTP health endpoints (/readyz, /healthz)
    healthPort: 9090
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 512Mi

# -- Vault Agent Injector
vault:
  enabled: false
  role: ""
  authPath: auth/k8s-silver
  namespace: platform-services
  secretPath: ""
  serviceAccountName: ""
